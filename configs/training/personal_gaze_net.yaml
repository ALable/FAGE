# PersonalGazeNet — Phase 1: Shared Pre-training
# All parameters trained jointly; reference = source (self-supervised)
#
# Launch:
#   accelerate launch train_personal_gaze_net.py \
#       --config configs/training/personal_gaze_net.yaml

model_name: "PersonalGazeNet"
exp_name:   "PGN-Phase1"
output_dir: "/mnt/data/xhy/Logs/PersonalGazeNet/logs/Phase1"
resume_from_checkpoint: False
seed: 42

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  dataset_type: "gaze_hdf"
  hdf_path: "/mnt/data/xhy/eye-concat/GazeCapture_256.h5"
  train_bs: 12
  num_workers: 6
  image_size: 256
  split_ratio: [0.8, 0.1, 0.1]
  frame_offset_range: 8
  max_head_diff: 0.1          # filter to < 5.7° head-pose change
  max_target_retries: 20
  eye_crop_size: [64, 64]
  eye_expand_ratio: 1.5
  input_eye_crop_size: [80, 80]
  input_eye_expand_ratio: 2.0
  # N_ref reference frames per sample (1 = self-supervised Phase 1)
  num_ref_frames: 1

# ---------------------------------------------------------------------------
# Pre-trained checkpoints
# ---------------------------------------------------------------------------
pretrained:
  gaze_eval_checkpoint_path: "/home/xuhy/PycharmProjects/Unet-Gaze/.logs/checkpoints/gazecapture_256_eye_concat/GazeHeadResNet/checkpoints/latest.pth"
  gaze_train_checkpoint_path: "/home/xuhy/PycharmProjects/Unet-Gaze/.logs/checkpoints/gazecapture_256_eye_concat/GazeHeadNet/checkpoints/best.pth"

# ---------------------------------------------------------------------------
# Model architecture
# ---------------------------------------------------------------------------
pgn_params:
  in_channels:    3
  hidden_size:    32
  mult_channels:  [1, 2, 4, 2, 1]
  depth:          [2, 2, 4, 2, 2]
  gaze_dim:       64
  id_emb_dim:     128          # global identity embedding dimension
  num_attn_heads: 4            # heads in cross-attention bottleneck
  warp_hidden:    128          # flow-predictor MLP hidden dim
  warp_max_disp:  0.3          # max displacement in norm coords
  affinef:        3            # gate + scale + shift in UNetBlock
  actfunc:        'gelu'
  dropout:        0.1
  num_groups:     32
  min_channels:   4

# ---------------------------------------------------------------------------
# Loss weights
# ---------------------------------------------------------------------------
loss_params:
  l1_loss:              2.0
  eye_l1_loss:          4.0
  # Flow smoothness loss: penalise non-smooth warping fields
  flow_smooth_loss:     0.01
  start_flow_smooth:    0        # enable from step 0
  vgg_layer_weight:     [5, 5, 5, 0, 0]
  pyramid_scale:        [1, 0.5, 0.25]
  eye_gan_loss:         0.3
  gaze_perceptual_loss: 0.01
  start_gaze_perceptual: 500
  id_loss:              0.1
  start_id_loss:        1000

# ---------------------------------------------------------------------------
# Discriminator
# ---------------------------------------------------------------------------
discriminator_train_params:
  discriminator_type: 'multi-scale'
  ndf: 64
  lr: 1.0e-4
  eps: 1.0e-8
  weight_decay: 0.01
  betas: [0.5, 0.999]
  epochs: 10000
  start_gan: 3000

model_params:
  discriminator_params:
    scales:          [1]
    block_expansion: 32
    max_features:    256
    num_blocks:      3
    sn:              True
    image_channel:   3
  gazenet_params:
    num_layers: 4
    num_in:     2
    num_hidden: 128

# ---------------------------------------------------------------------------
# Solver
# ---------------------------------------------------------------------------
solver:
  gradient_accumulation_steps: 1
  mixed_precision: 'no'
  max_train_steps: 200000
  max_grad_norm: 1.0
  learning_rate: 1.0e-4
  scale_lr: False
  lr_warmup_steps: 500
  lr_scheduler: "cosine"
  adam_beta1: 0.5
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-2
  adam_epsilon: 1.0e-8

# ---------------------------------------------------------------------------
# Checkpointing & logging
# ---------------------------------------------------------------------------
total_limit: 3
save_model_epoch_interval: 200000
checkpointing_steps: 5000
val_freq: 20000
val_batch_limit: 8
