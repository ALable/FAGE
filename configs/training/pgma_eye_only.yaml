# PGMA Phase 1: personalized gaze-memory eye generation
model_name: "PGMA"
exp_name: "PGMA-EyeOnly"
output_dir: "/mnt/data/xhy/Logs/FAGE"
resume_from_checkpoint: false
resume_strict: false
seed: 42

data:
  dataset_type: "gaze_hdf"
  hdf_path: "/mnt/data/xhy/eye-concat/GazeCapture_256.h5"
  train_bs: 16
  num_workers: 6
  image_size: 256
  split_ratio: [0.8, 0.1, 0.1]
  frame_offset_range: 8
  max_head_diff: 0.1
  max_target_retries: 20
  eye_crop_size: [64, 64]
  eye_expand_ratio: 1.5
  input_eye_crop_size: [80, 80]
  input_eye_expand_ratio: 2.0

pretrained:
  gaze_eval_checkpoint_path: "/home/xuhy/PycharmProjects/Unet-Gaze/.logs/checkpoints/gazecapture_256_eye_concat/GazeHeadResNet/checkpoints/latest.pth"
  gaze_train_checkpoint_path: "/home/xuhy/PycharmProjects/Unet-Gaze/.logs/checkpoints/gazecapture_256_eye_concat/GazeHeadNet/checkpoints/best.pth"

loss_params:
  l1_loss: 2.0
  eye_l1_loss: 4.0
  vgg_layer_weight: [5, 5, 5, 0, 0]
  pyramid_scale: [1, 0.5, 0.25]
  eye_gan_loss: 0.3
  gaze_perceptual_loss: 0.08
  start_gaze_perceptual: 100
  id_loss: 0.1
  start_id_loss: 1000

dic_unet_params:
  in_channels: 3
  hidden_size: 32
  mult_channels: [1, 2, 4, 2, 1]
  depth: [2, 2, 4, 2, 2]
  gaze_dim: 64
  skip_stride: 2
  affinef: 3
  actfunc: "gelu"
  norm_type: "gnorm"
  num_groups: 32
  min_channels: 4
  dropout: 0.1
  blockconfig: 2
  head_img_encoder: true
  head_img_dim: 128
  head_fusion_dim: 128
  personalized_gaze_adapter: true
  pgma_token_dim: 128
  pgma_base_channels: 32
  pgma_token_grid: [2, 4]
  pgma_num_heads: 4
  pgma_dropout: 0.0

discriminator_train_params:
  discriminator_type: "multi-scale"
  ndf: 64
  lr: 1.0e-4
  eps: 0.00000001
  weight_decay: 0.01
  betas: [0.5, 0.999]
  epochs: 10000
  start_gan: 2000

model_params:
  gazenet_params:
    num_layers: 6
    num_in: 2
    num_hidden: 256
    cross_condition: true
  discriminator_params:
    scales: [1]
    block_expansion: 32
    max_features: 256
    num_blocks: 3
    sn: true
    image_channel: 3

solver:
  gradient_accumulation_steps: 1
  mixed_precision: "no"
  max_train_steps: 400000
  max_grad_norm: 1.0
  learning_rate: 1.0e-4
  scale_lr: false
  lr_warmup_steps: 1000
  lr_scheduler: "cosine"
  adam_beta1: 0.5
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-2
  adam_epsilon: 1.0e-8

total_limit: 3
save_model_epoch_interval: 2000
checkpointing_steps: 5000
val_freq: 2000
val_batch_limit: 8
