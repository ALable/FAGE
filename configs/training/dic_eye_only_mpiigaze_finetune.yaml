# FAGE Per-User Adapter Fine-tuning on MPIIGaze
model_name: "FAGE"
exp_name: "FAGE-EyeOnly-MPIIGaze-Adapter"
output_dir: "/mnt/data/xhy/Logs/FAGE/logs/EyeOnly/MPIIGaze/adapters"
resume_from_checkpoint: False
seed: 42

# Data
data:
  dataset_type: "gaze_hdf"
  hdf_path: "/mnt/data/xhy/eye-concat/MPIIGaze_256.h5"
  train_bs: 8  # Smaller batch for fine-tuning
  num_workers: 4
  image_size: 256
  split_ratio: [0.8, 0.1, 0.1]
  frame_offset_range: 2  # Smaller offset for fine-tuning
  eye_crop_size: [64, 64]
  eye_expand_ratio: 1.5
  input_eye_crop_size: [80, 80]
  input_eye_expand_ratio: 2.0

# Pretrained gaze estimator (for gaze perceptual loss)
pretrained:
  gaze_eval_checkpoint_path: "/home/xuhy/PycharmProjects/Unet-Gaze/.logs/checkpoints/gazecapture_256_eye_concat/GazeHeadResNet/checkpoints/latest.pth"
  gaze_train_checkpoint_path: "/home/xuhy/PycharmProjects/Unet-Gaze/.logs/checkpoints/Unet-Gaze/GazeHeadNet/checkpoints/best.pth"

# Loss weights (same as Phase 1)
loss_params:
  l1_loss: 10.0
  eye_l1_loss: 20.0
  vgg_layer_weight: [5, 5, 5, 0, 0]
  pyramid_scale: [1, 0.5, 0.25]
  eye_gan_loss: 0
  gaze_perceptual_loss: 0.01
  # start_gaze_perceptual: 0  # Start immediately for fine-tuning
  id_loss: 0.1
  start_id_loss: 0  # Start immediately for fine-tuning
  lpips_loss: 30        # LPIPS perceptual loss weight (VGG backbone)
  lpips_size: [128, 128] # Resize resolution before LPIPS computation

# Eye-Only UNet (same architecture)
dic_unet_params:
  in_channels: 3
  hidden_size: 32
  mult_channels: [1, 2, 4, 2, 1]
  depth: [2, 2, 4, 2, 2]
  gaze_dim: 64
  skip_stride: 2
  affinef: 3
  actfunc: 'gelu'
  norm_type: 'gnorm'
  num_groups: 32
  min_channels: 4
  dropout: 0.1
  blockconfig: 2

# Discriminator (frozen during fine-tuning)
discriminator_train_params:
  discriminator_type: 'multi-scale'
  ndf: 64
  lr: 1.0e-4
  eps: 0.00000001
  weight_decay: 0.01
  betas: [0.5, 0.999]
  epochs: 10000
  start_gan: 999999  # Disable GAN loss during fine-tuning

model_params:
  gazenet_params:
    num_layers: 6
    num_in: 2
    num_hidden: 256
    cross_condition: true
  discriminator_params:
    scales: [1]
    block_expansion: 32
    max_features: 256
    num_blocks: 3
    sn: True
    image_channel: 3

# Solver (higher LR for adapter fine-tuning)
solver:
  gradient_accumulation_steps: 1
  mixed_precision: 'no'
  max_train_steps: 500  # Quick fine-tuning
  max_grad_norm: 1.0
  learning_rate: 5.0e-4  # Higher LR for adapter
  scale_lr: False
  lr_warmup_steps: 50
  lr_scheduler: "cosine"
  adam_beta1: 0.5
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-2
  adam_epsilon: 1.0e-8

# Checkpointing
total_limit: 2
save_model_epoch_interval: 500
checkpointing_steps: 100
val_freq: 100
val_batch_limit: 4
