# FAGE Phase 2: User Personalization (冻结 UNet, 训练 Mask Generator)
model_name: "FAGE"
exp_name: "FAGE-Personalized-v1"
output_dir: "/mnt/data/xhy/Logs/FAGE/logs/Personalized/v1"
resume_from_checkpoint: False
seed: 42

# Data (单用户)
data:
  dataset_type: "gaze_hdf"
  hdf_path: "/mnt/data/xhy/eye-concat/GazeCapture_256.h5"
  train_bs: 8
  num_workers: 4
  image_size: 256
  split_ratio: [0.8, 0.1, 0.1]
  frame_offset_range: 2
  eye_crop_size: [64, 64]
  eye_expand_ratio: 1.5

# Pretrained
pretrained:
  gaze_eval_checkpoint_path: "/home/xuhy/PycharmProjects/Unet-Gaze/.logs/checkpoints/gazecapture_256_eye_concat/GazeHeadResNet/checkpoints/latest.pth"
  gaze_train_checkpoint_path: "/home/xuhy/PycharmProjects/Unet-Gaze/.logs/checkpoints/gazecapture_256_eye_concat/GazeHeadNet/checkpoints/best.pth"

# Loss (同 Phase 1, 但减小 GAN 权重)
loss_params:
  l1_loss: 2.0
  eye_l1_loss: 5.0
  vgg_loss: 0.02
  vgg_mask_loss: 0
  id_loss_weight: 0
  vgg_layer_weight: [5, 5, 5, 0, 0]
  pyramid_scale: [1, 0.5]
  gan_loss: 0
  fm_loss: [0, 0, 0, 0]
  gaze_perceptual_loss: 0.01
  start_gaze_perceptual: 0
  eye_gan_loss: 0

# Eye-Only UNet (同 Phase 1, 冻结)
dic_unet_params:
  in_channels: 3
  hidden_size: 32
  mult_channels: [1, 2, 4, 2, 1]
  depth: [2, 2, 4, 2, 2]
  gaze_dim: 64
  skip_stride: 2
  affinef: 3
  actfunc: 'gelu'
  norm_type: 'gnorm'
  num_groups: 32
  min_channels: 4
  dropout: 0.1
  blockconfig: 2

# Personalization (Phase 2: enabled)
personalization:
  enabled: True
  phase: 2
  phase1_checkpoint: null  # 设置为 Phase 1 的 checkpoint 路径
  mask_generator:
    gaze_dim: 64
    hidden_dim: 128
    init_bias: 2.0
    tau_init: 1.0
    tau_min: 0.1
  target_user_id: null    # 指定目标用户
  lr: 1.0e-4
  max_finetune_steps: 1000
  lambda_sparse: 0.01
  lambda_entropy: 0.001

# Solver (Phase 2: 小步数)
solver:
  gradient_accumulation_steps: 1
  mixed_precision: 'no'
  max_train_steps: 1000
  max_grad_norm: 1.0
  learning_rate: 1.0e-4
  scale_lr: False
  lr_warmup_steps: 0
  lr_scheduler: "constant"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-2
  adam_epsilon: 1.0e-8

# Checkpointing
total_limit: 3
checkpointing_steps: 500
val_freq: 200
val_batch_limit: 4
