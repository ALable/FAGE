# FAGE Phase 1: Eye-Only Generation (共享预训练)
model_name: "FAGE"
exp_name: "FAGE-EyeOnly-v1"
output_dir: "/mnt/data/xhy/Logs/FAGE/logs/EyeOnly/v1"
resume_from_checkpoint: True
seed: 42

# Data
data:
  dataset_type: "gaze_hdf"
  hdf_path: "/mnt/data/xhy/eye-concat/GazeCapture_256.h5"
  train_bs: 16
  num_workers: 6
  image_size: 256
  split_ratio: [0.8, 0.1, 0.1]
  frame_offset_range: 2
  eye_crop_size: [64, 64]
  eye_expand_ratio: 1.5

# Pretrained gaze estimator (for gaze perceptual loss)
pretrained:
  gaze_eval_checkpoint_path: "/home/xuhy/PycharmProjects/Unet-Gaze/.logs/checkpoints/gazecapture_256_eye_concat/GazeHeadResNet/checkpoints/latest.pth"
  gaze_train_checkpoint_path: "/home/xuhy/PycharmProjects/Unet-Gaze/.logs/checkpoints/gazecapture_256_eye_concat/GazeHeadNet/checkpoints/best.pth"

# Loss weights
loss_params:
  l1_loss: 2.0
  eye_l1_loss: 4.0
  vgg_loss: 0.02
  vgg_mask_loss: 0
  id_loss_weight: 0
  vgg_layer_weight: [5, 5, 5, 0, 0]
  pyramid_scale: [1, 0.5, 0.25]
  gan_loss: 0.4
  fm_loss: [10.0, 10.0, 5, 0]
  gaze_perceptual_loss: 0.005
  start_gaze_perceptual: 500
  eye_gan_loss: 0.3

# Eye-Only UNet
dic_unet_params:
  in_channels: 3
  hidden_size: 32
  mult_channels: [1, 2, 4, 2, 1]
  depth: [2, 2, 4, 2, 2]
  gaze_dim: 64
  skip_stride: 2
  affinef: 3
  actfunc: 'gelu'
  norm_type: 'gnorm'
  num_groups: 32
  min_channels: 4
  dropout: 0.1
  blockconfig: 2

# Discriminator (for eye crops)
discriminator_train_params:
  discriminator_type: 'multi-scale'
  ndf: 64
  lr: 5.0e-5
  eps: 0.00000001
  weight_decay: 0.01
  betas: [0.5, 0.999]
  epochs: 10000
  start_gan: 3000

model_params:
  gazenet_params:
    num_layers: 4
    num_in: 2
    num_hidden: 128
  discriminator_params:
    scales: [1, 0.5]
    block_expansion: 32
    max_features: 256
    num_blocks: 3
    sn: True
    image_channel: 3

# Solver
solver:
  gradient_accumulation_steps: 1
  mixed_precision: 'no'
  max_train_steps: 200000
  max_grad_norm: 1.0
  learning_rate: 1.0e-4
  scale_lr: False
  lr_warmup_steps: 500
  lr_scheduler: "linear"
  adam_beta1: 0.5
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-2
  adam_epsilon: 1.0e-8

# Personalization (Phase 1: disabled)
personalization:
  enabled: False
  phase: 1

# Checkpointing
total_limit: 3
save_model_epoch_interval: 200000
checkpointing_steps: 5000
val_freq: 2000
val_batch_limit: 8
